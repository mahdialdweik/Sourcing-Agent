        // --- Navigation / Mobile keyboard helper ---
        focusNext(el) {
          const focusable = Array.from(document.querySelectorAll('input:not([type="hidden"]), button, select, textarea, [tabindex]:not([tabindex="-1"])'))
            .filter(e => !e.disabled && e.offsetParent !== null);
          const index = focusable.indexOf(el);
          if (index > -1 && index < focusable.length - 1) {
            focusable[index + 1].focus();
          }
        },

        // --- MultiSelect Logic ---
        filteredOptions(key, options) {
          const q = this.searchQuery[key]?.toLowerCase() || '';
          return options.filter(opt => opt.toLowerCase().includes(q));
        },

        toggleSelection(key, value) {
          const currentArray = this.formData[key] || [];
          if (currentArray.includes(value)) {
            this.formData[key] = currentArray.filter(item => item !== value);
          } else {
            this.formData[key] = [...currentArray, value];
          }
        },

        selectAll(key, options) {
          this.formData[key] = [...options];
        },

        // --- Tags Logic ---
        addTag(key) {
          const val = (this.tagInputs[key] || '').trim();
          if (val && !this.formData[key].includes(val)) {
            this.formData[key] = [...this.formData[key], val];
          }
          this.tagInputs[key] = '';
        },

        addTagAndNext(key, event) {
          if ((this.tagInputs[key] || '').trim()) {
            this.addTag(key);
          } else {
            this.focusNext(event.target);
          }
        },

        handleBackspace(key) {
          if (this.tagInputs[key] === '' && this.formData[key].length > 0) {
            const newArray = [...this.formData[key]];
            newArray.pop();
            this.formData[key] = newArray;
          }
        },

        removeTag(key, index) {
          const newArray = [...this.formData[key]];
          newArray.splice(index, 1);
          this.formData[key] = newArray;
        },

              setTimeout(() => { if (this.status === 'validation_error') this.status = 'idle' }, 3000);
              return; 
            }
          }

          this.status = 'loading';

          // 3. Format Payload (Join tag arrays back to comma-separated strings so your n8n workflow doesn't break)
          const payload = JSON.parse(JSON.stringify(this.formData));
          this.fields.forEach(field => {
            if (field.type === 'tags') {
              payload[field.key] = payload[field.key].join(', ');
            }
          });
          
          payload['Recently Changed Jobs'] = payload['Recently Changed Jobs'] ? "true" : "false";
          payload['Recently Posted On LinkedIn'] = payload['Recently Posted On LinkedIn'] ? "true" : "false";
          payload['submittedAt'] = new Date().toISOString();
          payload['formMode'] = "production";

          const finalPayload = [payload];

          try {
            const response = await fetch(N8N_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalPayload)
            });

            if (response.ok || response.status === 200 || response.type === 'opaque') {
              this.status = 'success';
              setTimeout(() => this.status = 'idle', 4000);
            } else {
              if (response.status === 404 && N8N_WEBHOOK_URL.includes('/webhook-test/')) {
                  throw new Error("n8n Webhook is asleep. Click 'Listen for Test Event' in n8n first!");
              } else {
                  throw new Error(`n8n Server Rejected Payload (Status ${response.status})`);
              }
            }
          } catch (error) {
            this.status = 'error';
            this.errorMessage = error.message.includes('Failed to fetch') 
              ? 'Network Error. Check n8n CORS settings or URL.' 
              : error.message;
              
            console.error("Webhook Error:", error);
            setTimeout(() => {
                if (this.status === 'error') {
                    this.status = 'idle';
                    this.errorMessage = '';
                }
            }, 8000);
          }
        }
      };
    };
  </script>

      </div>

      <!-- Action Footer (Sticky on Mobile) -->
      <div class="absolute bottom-0 left-0 right-0 md:relative bg-zinc-900/90 md:bg-zinc-900/80 backdrop-blur-md border-t border-zinc-800 p-4 md:p-5 md:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 md:gap-4 z-20">
        <div class="text-xs md:text-sm flex items-center gap-2 text-center sm:text-left w-full sm:w-auto justify-center sm:justify-start">
          <div class="w-2 h-2 rounded-full flex-shrink-0" 
               :class="{
                 'bg-zinc-600': status === 'idle',
                 'bg-brand-400 animate-ping': status === 'loading',
                 'bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.5)]': status === 'success',
                 'bg-rose-400 shadow-[0_0_10px_rgba(251,113,133,0.5)]': status === 'error',
                 'bg-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.5)]': status === 'validation_error'
               }"></div>
          <span x-show="status === 'idle'" class="text-zinc-400 font-medium">System ready.</span>
          <span x-show="status === 'loading'" class="text-brand-400 font-medium">Processing payload...</span>
          <span x-show="status === 'success'" class="text-emerald-400 font-medium">Delivered successfully!</span>
          <span x-show="status === 'error'" class="text-rose-400 font-medium truncate max-w-[200px] md:max-w-none" x-text="errorMessage"></span>
          <span x-show="status === 'validation_error'" class="text-amber-400 font-medium truncate max-w-[200px] md:max-w-none" x-text="errorMessage"></span>
        </div>
        
        <button type="button" @click="submitData" :disabled="status === 'loading'"
          class="w-full sm:w-auto relative group overflow-hidden bg-zinc-800 text-white font-semibold py-3 md:py-2.5 px-8 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-900 shadow-lg md:shadow-none">
          <div class="absolute inset-0 bg-gradient-to-r from-brand-600 to-violet-600 opacity-90 group-hover:opacity-100 transition-opacity"></div>
          
          <div class="relative flex items-center justify-center gap-2">
            <svg x-show="status !== 'loading'" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <svg x-show="status === 'loading'" class="w-4 h-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span x-show="status !== 'loading'">Source Candidates</span>
            <span x-show="status === 'loading'">Executing...</span>
          </div>
        </button>
      </div>

    </div>
  </div>

</body>
</html>
